<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racks and Style — Unit Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      #FAFAF9;
    --surface: #FFFFFF;
    --ink:     #17171A;
    --soft:    #8C8B86;
    --line:    #E7E5DF;
    --accent:  #3F4B3D;
    --radius:  2px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:40;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 32px;
    max-width:1120px; margin:0 auto;
  }
  .logo-text{ font-size:15px; font-weight:600; letter-spacing:0.01em; }
  .logo-sub{ font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:0.1em; color:var(--soft); display:block; margin-top:3px; text-transform:uppercase; }

  /* ---------- HERO ---------- */
  .hero{ border-bottom:1px solid var(--line); }
  .hero-inner{
    padding:64px 32px 48px;
    max-width:1120px; margin:0 auto;
  }
  .hero .eyebrow{ 
    font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--soft); margin-bottom:16px; display:block; 
  }
  .hero h1{
    font-size:clamp(32px,4vw,48px);
    font-weight:600;
    line-height:1.15;
    letter-spacing:-0.015em;
    margin-bottom:12px;
  }
  .hero p{
    color:var(--soft); font-size:15px; line-height:1.65; max-width:46ch;
  }

  /* ---------- MAIN CONVERTER SECTION ---------- */
  main{ 
    flex:1; 
    padding:56px 32px 96px; 
    max-width:1120px; 
    margin:0 auto; 
    width:100%;
  }

  .converter-card{
    background:var(--surface);
    border:1px solid var(--line);
    max-width:560px;
    margin:0 auto;
    padding:36px;
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  .converter-group{ display:flex; flex-direction:column; gap:8px; }
  .converter-group label{
    font-family:'IBM Plex Mono'; font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--soft); font-weight:500;
  }
  
  .converter-input, .converter-select{
    width:100%; padding:14px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Mono'; font-size:15px;
    transition:border-color .15s;
  }
  .converter-input:focus, .converter-select:focus{
    outline:none; border-color:var(--ink);
  }

  .converter-result{
    margin-top:8px; padding:24px;
    background:var(--bg); border:1px solid var(--line);
    text-align:center; border-radius:var(--radius);
  }
  .converter-result .res-val{
    font-family:'IBM Plex Mono'; font-size:28px; font-weight:600; color:var(--accent);
  }
  .converter-result .res-lbl{
    font-size:12px; color:var(--soft); font-family:'IBM Plex Mono'; margin-top:6px; letter-spacing:0.03em;
  }

  /* ---------- FOOTER ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:32px; text-align:center; margin-top:auto;
  }
  footer p{ font-size:11px; color:var(--soft); font-family:'IBM Plex Mono'; letter-spacing:0.04em; }

  @media (max-width:600px){
    .header-inner{ padding:18px 20px; }
    .hero-inner{ padding:40px 20px 32px; }
    main{ padding:32px 20px 64px; }
    .converter-card{ padding:24px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="logo-text">Racks and Style</div>
      <span class="logo-sub">Your One-Stop Online Retail Store</span>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <span class="eyebrow">Utility Tool</span>
    <h1>Unit Converter</h1>
    <p>Convert distance, length, and weight metrics quickly and accurately.</p>
  </div>
</section>

<main>
  <div class="converter-card">
    <div class="converter-group">
      <label for="convertType">Conversion Mode</label>
      <select id="convertType" class="converter-select">
        <option value="km_m">Kilometers to Meters (km → m)</option>
        <option value="m_km">Meters to Kilometers (m → km)</option>
        <option value="kg_g">Kilograms to Grams (kg → g)</option>
        <option value="g_kg">Grams to Kilograms (g → kg)</option>
        <option value="cm_m">Centimeters to Meters (cm → m)</option>
        <option value="m_cm">Meters to Centimeters (m → cm)</option>
      </select>
    </div>
    
    <div class="converter-group">
      <label for="convertInput">Enter Value</label>
      <input type="number" id="convertInput" class="converter-input" placeholder="Enter amount..." value="1" step="any">
    </div>

    <div class="converter-result">
      <div class="res-val" id="convertOutput">1000 m</div>
      <div class="res-lbl" id="convertFormula">1 km = 1,000 m</div>
    </div>
  </div>
</main>

<footer>
  <p>RACKS AND STYLE · 118 MAIN ST · OPEN 9–6 DAILY</p>
</footer>

<script>
(function(){
  "use strict";

  const convertType   = document.getElementById('convertType');
  const convertInput  = document.getElementById('convertInput');
  const convertOutput = document.getElementById('convertOutput');
  const convertFormula = document.getElementById('convertFormula');

  function calculateConversion(){
    const val = parseFloat(convertInput.value);
    if(isNaN(val)){
      convertOutput.textContent = '0';
      return;
    }

    const type = convertType.value;
    let result = 0;
    let unit = '';
    let formulaText = '';

    switch(type) {
      case 'km_m':
        result = val * 1000;
        unit = 'm';
        formulaText = '1 km = 1,000 m';
        break;
      case 'm_km':
        result = val / 1000;
        unit = 'km';
        formulaText = '1,000 m = 1 km';
        break;
      case 'kg_g':
        result = val * 1000;
        unit = 'g';
        formulaText = '1 kg = 1,000 g';
        break;
      case 'g_kg':
        result = val / 1000;
        unit = 'kg';
        formulaText = '1,000 g = 1 kg';
        break;
      case 'cm_m':
        result = val / 100;
        unit = 'm';
        formulaText = '100 cm = 1 m';
        break;
      case 'm_cm':
        result = val * 100;
        unit = 'cm';
        formulaText = '1 m = 100 cm';
        break;
    }

    const formattedResult = Number.isInteger(result) ? result : result.toFixed(3).replace(/\.?0+$/, "");
    convertOutput.textContent = `${formattedResult} ${unit}`;
    convertFormula.textContent = formulaText;
  }

  convertType.addEventListener('change', calculateConversion);
  convertInput.addEventListener('input', calculateConversion);

  calculateConversion();
})();
</script>

</body>
</html>
